<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System - Three.js (Realistic Textures)</title>
  <meta class="title" content="Solar System - Three.js (Realistic Textures)">
  <meta name="description" content="A realistic solar system simulation built with Three.js, featuring accurate planetary textures, orbits, and moons.">

  <!-- custom css link -->
  <link rel="stylesheet" href="./src/css/style.css">

  <!-- preload images -->

  <link rel="stylesheet" as="image" href="static/background.jpg" class="preload">
  
</head>
<body>
<div id="loadingScreen">
  <div>Loading planetary textures&hellip;</div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
</div>

<div id="info">
  <b>Solar System (Based on Three.js)</b><br>
  Drag = rotate view &nbsp; Scroll = zoom &nbsp; Right-drag = pan<br>

</div>

<div id="toggles">
  <label><input type="checkbox" id="toggleOrbits" checked> Orbit lines</label>
  <label><input type="checkbox" id="toggleMoons" checked> Moons</label>
  <label><input type="checkbox" id="toggleBelt" checked> Asteroid belt</label>
  <label><input type="checkbox" id="toggleLabels" checked> Hover labels</label>
  <label><input type="checkbox" id="toggleClickToFocus"> Click to focus</label>
  <div class="focusControl">
    <label for="focusSelect">Focus on:</label>
    <select id="focusSelect" aria-label="Focus on celestial body">
      <option value="">Free camera</option>
    </select>
  </div>
</div>

<div id="designCredit">design by @KRKRaju</div>

<div id="speedControl">
  <label for="speedPreset">Time:</label>
  <select id="speedPreset">
    <option value="1">Real time</option>
    <option value="60">1 min/sec</option>
    <option value="3600">1 hour/sec</option>
    <option value="86400" selected>1 day/sec</option>
    <option value="604800">1 week/sec</option>
    <option value="2629800">1 month/sec</option>
    <option value="31536000">1 year/sec</option>
  </select>
  <button id="btnPause" type="button">Pause</button>
  <button id="btnNow" type="button">Now</button>
  <div id="simDate"></div>
</div>
<div id="planetLabel"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./src/js/script.js"></script>
</body>
</html>
